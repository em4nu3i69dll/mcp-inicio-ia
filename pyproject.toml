[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-inicio-ia"
version = "1.0.0"
description = "Servidor MCP con documentos, busqueda local y asistente con Ollama"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0"]

[project.scripts]
mcp-inicio = "mcp_inicio.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_inicio*"]
