name: Verificar MCP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s pruebas -v
      - run: python -m mcp_inicio preparar
      - run: python -m mcp_inicio comprobar
